<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Album</title>
    <style>
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 1200px;
            margin: 30px auto;
        }
        
        .photo-item {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            aspect-ratio: 1;
            transition: transform 0.3s ease;
            background-color: #f8f9fa;
        }
        
        .photo-item:hover {
            transform: translateY(-5px);
        }
        
        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 10px;
            box-sizing: border-box;
        }
        
        .photo-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            text-align: center;
        }

        .delete-button {
            position: absolute;
            top: 5px;
            right: 5px;
            background-color: red;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            padding: 5px;
        }

        .photo-description {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            font-size: 0.9em;
        }
        
        .photo-item:hover .photo-description {
            display: block;
        }

        .upload-section {
            display: flex;
            justify-content: center; /* 使内容水平居中 */
            margin-top: 10px;
        }

        .upload-section button {
            margin: 0 10px; /* 按钮之间的间距 */
        }
    </style>
</head>
<body>
     <div class="container">
        <!-- Header -->
        <div class="header">
        </div>
  

    <div style="border: 2px solid rgb(71, 31, 153); width: 790px; margin: 20px auto; padding: 10px; box-sizing: border-box;">
        <h2 style="text-align: center;">我的相冊</h2>

        <div id="uploadArea" class="upload-section">
            <input type="file" id="imageUpload" style="display: none;" accept="image/*">
            <button id="addImageButton" style="border: none; background-color: #4CAF50; color: white; padding: 5px 10px; cursor: pointer;">
                上傳圖片
            </button>
            <button id="submitImageButton" style="border: none; background-color: #007BFF; color: white; padding: 5px 10px; cursor: pointer;">
                提交圖片
            </button>
        </div>

        <div id="photoGrid" class="photo-grid"></div>
    </div>

    <script src="/dist/client/index.js"></script>
    <script>
        document.getElementById('addImageButton').addEventListener('click', function() {
            document.getElementById('imageUpload').click();
        });

        document.getElementById('submitImageButton').addEventListener('click', function() {
            const fileInput = document.getElementById('imageUpload');
            const photoGrid = document.getElementById('photoGrid');

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    const photoItem = document.createElement('div');
                    photoItem.classList.add('photo-item');

                    const img = document.createElement('img');
                    img.src = e.target.result;

                    const title = document.createElement('div');
                    title.classList.add('photo-title');
                    title.textContent = "";

                    const description = document.createElement('div');
                    description.classList.add('photo-description');

                    const today = new Date();
                    const options = { year: 'numeric', month: 'long', day: 'numeric' };
                    description.textContent = today.toLocaleDateString('zh-CN', options);

                    const deleteButton = document.createElement('button');
                    deleteButton.classList.add('delete-button');
                    deleteButton.textContent = 'X';
                    deleteButton.onclick = function() {
                        photoGrid.removeChild(photoItem);
                    };

                    photoItem.appendChild(img);
                    photoItem.appendChild(title);
                    photoItem.appendChild(description);
                    photoItem.appendChild(deleteButton);
                    photoGrid.appendChild(photoItem);
                };
                reader.readAsDataURL(file);
            } else {
                alert('choose a file first!');
            }
        });
    </script>
</body>
</html>
