<!DOCTYPE html>
<html lang="en">
<head>
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Page</title>
    <link rel="stylesheet" href="styles.css" />
</head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Album</title>
    <style>
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 1200px;
            margin: 30px auto;
        }
        
        /* 響應式設計：當螢幕寬度小於768px時，顯示2列 */
        @media (max-width: 768px) {
            .photo-grid {
                grid-template-columns: repeat(2, 1fr);
                max-width: 600px;
            }
        }
        
        /* 響應式設計：當螢幕寬度小於480px時，顯示1列 */
        @media (max-width: 480px) {
            .photo-grid {
                grid-template-columns: repeat(1, 1fr);
                max-width: 300px;
            }
        }
        
        .photo-item {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            aspect-ratio: 1;
            transition: transform 0.3s ease;
            background-color: #f8f9fa;
        }
        
        .photo-item:hover {
            transform: translateY(-5px);
        }
        
        /* 已標記的照片樣式 */
        .photo-item.flagged {
            cursor: not-allowed !important;
        }
        
        .photo-item.flagged:hover {
            transform: none;
        }
        
        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 10px;
            box-sizing: border-box;
        }
        
        .photo-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            text-align: center;
        }

        /* 重置 delete-button 的樣式，避免被通用 button 樣式覆蓋 */
        .photo-item .delete-button {
            position: absolute;
            top: 5px;
            right: 5px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            padding: 2px 6px;
            min-width: auto;
            max-width: auto;
            flex: none;
            margin: 0;
            font-size: 11px;
            line-height: 1;
            width: auto;
            height: auto;
            display: inline-block;
            font-weight: bold;
            z-index: 10;
        }
        
        .photo-item .delete-button:hover {
            background-color: #c82333;
            opacity: 1;
        }

        .photo-description {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            font-size: 0.9em;
        }
        
        .photo-item:hover .photo-description {
            display: block;
        }

        .upload-section {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        /* 重置上傳按鈕的樣式，避免被通用 button 樣式覆蓋 */
        .upload-section #addImageButton,
        .upload-section #submitImageButton {
            margin: 0 10px;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px;
            min-width: auto;
            max-width: auto;
            flex: none;
        }
        
        .upload-section #addImageButton {
            background-color: #4CAF50;
            color: white;
        }
        
        .upload-section #addImageButton:hover {
            background-color: #45a049;
        }
        
        .upload-section #submitImageButton {
            background-color: #007BFF;
            color: white;
        }
        
        .upload-section #submitImageButton:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
     <div class="container">
        <!-- Header -->
        <div class="header">
        </div>
  

    <div style="border: 2px solid rgb(71, 31, 153); width: 790px; max-width: 95%; margin: 20px auto; padding: 10px; box-sizing: border-box;">
        <h2 style="text-align: center;">我的相冊</h2>

        <div id="uploadArea" class="upload-section">
            <input type="file" id="imageUpload" style="display: none;" accept="image/*">
            <button id="addImageButton">
                上傳圖片
            </button>
            <button id="submitImageButton">
                提交圖片
            </button>
        </div>

        <div id="photoGrid" class="photo-grid"></div>
    </div>

    <script src="/dist/client/index.js"></script>
    <script src="/dist/client/my_albums.js"></script>
</body>
</html>
