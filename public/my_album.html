<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Album</title>
    <style>
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 1200px;
            margin: 30px auto;
        }
        
        .photo-item {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            aspect-ratio: 1;
            transition: transform 0.3s ease;
            background-color: #f8f9fa;
        }
        
        .photo-item:hover {
            transform: translateY(-5px);
        }
        
        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 10px;
            box-sizing: border-box;
        }
        
        .photo-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            text-align: center;
        }
        
        .photo-description {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            font-size: 0.9em;
        }
        
        .photo-item:hover .photo-description {
            display: block;
        }
    </style>
</head>
<body>
    <div style="border: 2px solid rgb(71, 31, 153); width: 790px; margin: 20px auto; padding: 10px; box-sizing: border-box;">
        <h2 style="text-align: center;">我的相冊</h2>

        <div id="uploadArea" class="upload-section">
            <div style="display: flex; align-items: center; margin-top: 10px;">
                <input type="file" id="imageUpload" style="display: none;" accept="image/*">
                <button id="addImageButton" style="border: none; background-color: #4CAF50; color: white; padding: 5px 10px; cursor: pointer; margin-left: 10px;">
                    上傳圖片
                </button>
                <button id="submitImageButton" style="border: none; background-color: #007BFF; color: white; padding: 5px 10px; cursor: pointer; margin-left: 10px;">
                    提交相片
                </button>
            </div>
        </div>

        <div id="photoGrid" class="photo-grid"></div>
    </div>

    <script src="/dist/client/index.js"></script>
    <script>
        document.getElementById('addImageButton').addEventListener('click', function() {
            document.getElementById('imageUpload').click();
        });

        document.getElementById('submitImageButton').addEventListener('click', function() {
            const fileInput = document.getElementById('imageUpload');
            const photoGrid = document.getElementById('photoGrid');

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    const photoItem = document.createElement('div');
                    photoItem.classList.add('photo-item');

                    const img = document.createElement('img');
                    img.src = e.target.result;

                    const title = document.createElement('div');
                    title.classList.add('photo-title');
                    title.textContent = "Uploaded Image";

                    const description = document.createElement('div');
                    description.classList.add('photo-description');
                    description.textContent = "Description for the image";

                    photoItem.appendChild(img);
                    photoItem.appendChild(title);
                    photoItem.appendChild(description);
                    photoGrid.appendChild(photoItem);
                };
                reader.readAsDataURL(file);
            } else {
                alert('请先选择一张图片。');
            }
        });
    </script>
</body>
</html>
