<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-header="logo-only">
    <div class="container">
      <div class="registration-form">
        <!-- Tab 切換按鈕 -->
        <div class="tab-container">
          <button class="tab-button active" id="registerTab" onclick="switchTab('register')">會員註冊</button>
          <button class="tab-button" id="loginTab" onclick="switchTab('login')">會員登入</button>
        </div>

        <div class="field" id="usernameField">
          <label for="usernameInput">Username:</label>
          <input type="text" id="usernameInput" placeholder="請輸入用戶名" />
        </div>
        <div class="field" id="emailField">
          <label for="emailInput">Email:</label>
          <input type="email" id="emailInput" placeholder="請輸入電子郵件" />
        </div>
        <div class="field" id="passwordField">
          <label for="passwordInput">Password:</label>
          <input type="password" id="passwordInput" placeholder="請輸入密碼" />
        </div>
        <div class="field" id="confirmPasswordField">
          <label for="confirmPasswordInput">Confirm Password:</label>
          <input type="password" id="confirmPasswordInput" placeholder="請再次輸入密碼" />
        </div>
        <p id="resultMessage"></p>

        <div class="buttons">
          <button id="registerButton" onclick="subRegister()" >Register</button>
          <button id="loginButton" onclick="submitLogin()">Login</button>
        </div>
      </div>
    </div>

    <script src="/dist/client/index.js"></script>
    <script src="/dist/client/register.js"></script>
  </body>
</html>
