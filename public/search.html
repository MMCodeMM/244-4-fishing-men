<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>
    <link rel="stylesheet" href="styles.css">
    <style>
  .search-methods {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin: 30px 0;
    flex-wrap: wrap;
    }
  
  .search-methods input[type="text"] {
    padding: 8px;
    width: 200px;
    border: 3px solid rgb(71, 30, 153);
    border-radius: 50px;
    outline: none;
    font-size: 16px;
    }
    
  .search-methods input[type="text"]:focus {
    background-color: #f0f0f0;
    }
    
  .search-methods input[type="text"]::placeholder {
    color: #999;
    font-style: italic;
    }
    </style>
</head>
<body>
<div class="container"></div>
    <div class="search-methods">
      <label>
        <input type="file" accept="image/*" capture="environment" style="display:none" id="cameraInput">
        <button type="button" onclick="document.getElementById('cameraInput').click()">拍照上傳</button>
      </label>
      <label>
        <input type="file" accept="image/*" style="display:none" id="fileInput">
        <button type="button" onclick="document.getElementById('fileInput').click()">選擇圖片</button>
      </label>
      <input type="text" id="searchNameInput" placeholder="名稱搜尋" onkeydown="if(event.key==='Enter'){searchByName();}">
    </div>
      <div id="searchResult" style="text-align:center; margin-top:30px;"></div>
    <script src="/dist/client/index.js"></script>
    <script src="/dist/client/search.js"></script>
</body>
</html>
